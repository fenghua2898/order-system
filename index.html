<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>球号订购系统</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif}
body{background:#f4f6fa;color:#222;padding-bottom:70px}
.wrap{max-width:480px;margin:auto;padding:12px}
.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px #0001}
.title{font-size:18px;font-weight:700;color:#4b3bbd;margin-bottom:10px}
.sub{font-size:12px;color:#888;margin-bottom:8px}
input,textarea{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;margin-bottom:10px;font-size:15px}
input:focus,textarea:focus{border-color:#6c5ce7;outline:none}
.btn{width:100%;padding:12px;border:none;border-radius:10px;color:#fff;font-size:16px;font-weight:600;cursor:pointer;margin-bottom:8px}
.btn.purple{background:linear-gradient(135deg,#6c5ce7,#a29bfe)}
.btn.green{background:#27ae60}
.btn.red{background:#e74c3c}
.btn.gray{background:#bbb}
.row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee;gap:8px}
.row:last-child{border:none}
.tag{padding:2px 8px;border-radius:10px;background:#eee;font-size:12px;white-space:nowrap}
.tag.ok{background:#d4edda;color:#155724}
.center{text-align:center}
.small{font-size:12px;color:#888}
.balls{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.ball{padding:7px 0;border:1px solid #ddd;border-radius:8px;text-align:center;font-size:13px;cursor:pointer;background:#fff;user-select:none}
.ball.on{background:#6c5ce7;color:#fff;border-color:#6c5ce7}
.big{color:#e74c3c;font-size:22px;font-weight:800}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #eee;display:flex;padding:8px 0;z-index:10}
.nav div{flex:1;text-align:center;font-size:12px;color:#888;cursor:pointer}
.nav div.on{color:#6c5ce7;font-weight:700}
.nav span{display:block;font-size:20px}
#modal{display:none;position:fixed;inset:0;background:#0008;z-index:50;align-items:center;justify-content:center;padding:20px}
#modal.on{display:flex}
#mbox{background:#fff;width:100%;max-width:360px;border-radius:14px;padding:20px;position:relative;max-height:85vh;overflow:auto}
.close{position:absolute;right:12px;top:8px;font-size:22px;color:#999;cursor:pointer}
#toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 18px;border-radius:8px;z-index:99;display:none;font-size:14px}
#toast.show{display:block}
.qtybox{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.qtybox button{width:36px;height:36px;border:1px solid #ddd;border-radius:8px;background:#fff;font-size:18px;cursor:pointer}
.qtybox input{width:70px;text-align:center;margin:0}
</style>
</head>
<body>
<div class="wrap"><div id="view"></div></div>

<div class="nav">
  <div id="n-buy" onclick="showView('buy')"><span>🎯</span>选购</div>
  <div id="n-my" onclick="showView('my')"><span>📋</span>我的</div>
  <div id="n-adm" onclick="showView('adm')"><span>⚙️</span>后台</div>
</div>

<div id="modal"><div id="mbox"></div></div>
<div id="toast"></div>

<script>
const DB={
 get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},
 set(k,v){localStorage.setItem(k,JSON.stringify(v))}
};
let _users=DB.get('users',[]),_orders=DB.get('orders',[]);
let _me=DB.get('me',null),_total=DB.get('total',36);
let _ref=DB.get('ref',0),_qr=DB.get('qr',''),_rule=DB.get('rule','');
let _sel=[],_qty=1,_amt=null;

function isAdmin(acc){return acc==='fenghua2898'}
function curIsAdmin(){return _me&&isAdmin(_me.acc)}
function saveUsers(){DB.set('users',_users)}
function saveOrders(){DB.set('orders',_orders)}
function afterLogin(){
  document.getElementById('n-adm').style.display=curIsAdmin()?'block':'none';
  showView('buy')
}
function showView(v){
  ['buy','my','adm'].forEach(x=>document.getElementById('n-'+x).classList.toggle('on',x===v));
  if(v==='buy')renderBuy();else if(v==='my')renderMy();else renderAdm()
}

/* 登录注册 */
function authView(){
  return `<div class="card">
    <div class="title">球号订购系统</div>
    <input id="acc" placeholder="账号">
    <input id="pwd" type="password" placeholder="密码">
    <input id="nick" placeholder="昵称（注册用）">
    <button class="btn purple" onclick="doLogin()">登录</button>
    <button class="btn gray" onclick="doReg()">注册</button>
    <div class="small center">仅账号 fenghua2898 为管理员</div>
  </div>`
}
function doLogin(){
  const acc=document.getElementById('acc').value.trim(),pwd=document.getElementById('pwd').value.trim();
  const u=_users.find(x=>x.acc===acc&&x.pwd===pwd);
  if(!u)return toast('账号或密码错误');
  _me=u;DB.set('me',u);afterLogin();toast('登录成功')
}
function doReg(){
  const acc=document.getElementById('acc').value.trim(),pwd=document.getElementById('pwd').value.trim(),nick=document.getElementById('nick').value.trim()||acc;
  if(!acc||!pwd)return toast('账号密码不能为空');
  if(_users.some(x=>x.acc===acc))return toast('账号已存在');
  _users.push({acc,pwd,nick});saveUsers();
  _me={acc,pwd,nick};DB.set('me',_me);afterLogin();toast('注册成功')
}
function logout(){_me=null;DB.set('me',null);document.getElementById('view').innerHTML=authView();document.getElementById('n-adm').style.display='none'}

/* 选购 */
function suggested(){return (_sel.length*_qty*_ref).toFixed(2)}
function renderBuy(){
  if(!_me){document.getElementById('view').innerHTML=authView();return}
  let balls='';
  for(let i=1;i<=_total;i++)balls+=`<div class="ball ${_sel.includes(i)?'on':''}" onclick="pick(${i})">${i}</div>`;
  const sug=suggested();
  const amtVal=_amt===null?sug:_amt;
  document.getElementById('view').innerHTML=`
  <div class="card">
    <div class="title">🎯 选购球号</div>
    ${_ref>0?`<div class="sub">参考价：¥${_ref.toFixed(2)}/球号（仅供参考，金额可自行填写）</div>`:''}
    ${_rule?`<div class="small" style="margin-bottom:8px;white-space:pre-wrap">💡 ${_rule}</div>`:''}
    <div class="balls">${balls}</div>
  </div>
  <div class="card">
    <div class="title">填写订单</div>
    <div class="sub">购买数量</div>
    <div class="qtybox">
      <button onclick="chgQty(-1)">−</button>
      <input id="qtyIn" type="number" min="1" value="${_qty}" onchange="setQty(this.value)">
      <button onclick="chgQty(1)">＋</button>
    </div>
    <div class="sub">付款金额（元）${_ref>0?'（已按参考价预填，可修改）':''}</div>
    <input id="amtIn" type="number" min="0" step="0.01" value="${amtVal}" oninput="_amt=this.value" placeholder="请输入金额">
    <div class="row"><span>已选球号</span><b>${_sel.length?_sel.join(','):'未选'}</b></div>
    <div class="row"><span>付款金额</span><span class="big">¥${(parseFloat(amtVal)||0).toFixed(2)}</span></div>
    <button class="btn purple" onclick="order()">确认下单</button>
  </div>`
}
function pick(n){_sel.includes(n)?_sel=_sel.filter(x=>x!==n):_sel.push(n);_sel.sort((a,b)=>a-b);_amt=null;renderBuy()}
function chgQty(d){_qty=Math.max(1,_qty+d);_amt=null;renderBuy()}
function setQty(v){_qty=Math.max(1,parseInt(v)||1);_amt=null;renderBuy()}
function order(){
  if(!_sel.length)return toast('请先选择球号');
  const amt=parseFloat(document.getElementById('amtIn').value)||0;
  if(amt<=0)return toast('请填写付款金额');
  modal(`<div class="title">确认下单</div>
    <div class="row"><span>球号</span><b>${_sel.join(',')}</b></div>
    <div class="row"><span>数量</span><b>${_qty}</b></div>
    <div class="row"><span>付款金额</span><span class="big">¥${amt.toFixed(2)}</span></div>
    ${_qr?`<img src="${_qr}" style="width:100%;border-radius:8px;margin:10px 0">`:'<div class="small">⚠️ 管理员还没设置收款码</div>'}
    <div class="small center" style="margin-bottom:10px">请按上面金额扫码付款，然后点下面按钮</div>
    <button class="btn green" onclick="confirmOrder(${amt})">我已付款，确认提交</button>
    <button class="btn gray" onclick="closeModal()">取消</button>`)
}
function confirmOrder(amt){
  _orders.unshift({id:Date.now(),acc:_me.acc,nick:_me.nick,balls:[..._sel],qty:_qty,price:amt,status:'待确认',time:new Date().toLocaleString()});
  saveOrders();closeModal();_sel=[];_qty=1;_amt=null;renderBuy();toast('下单成功，等卖家确认')
}

/* 我的 */
function renderMy(){
  if(!_me)return authView();
  const mine=_orders.filter(o=>o.acc===_me.acc);
  document.getElementById('view').innerHTML=`<div class="card">
    <div class="title">📋 我的订单</div>
    ${mine.length?mine.map(o=>`<div class="row"><div><b>球号${o.balls.join(',')}</b> ×${o.qty}<div class="small">¥${o.price} · ${o.time}</div></div><span class="tag ${o.status==='已确认'?'ok':''}">${o.status}</span></div>`).join(''):'<div class="center small">暂无订单</div>'}
    <button class="btn gray" onclick="logout()" style="margin-top:12px">退出登录</button>
  </div>`
}

/* 后台 */
function renderAdm(){
  if(!curIsAdmin())return showView('buy');
  const totalAmt=_orders.reduce((s,o)=>s+o.price,0),okAmt=_orders.filter(o=>o.status==='已确认').reduce((s,o)=>s+o.price,0);
  document.getElementById('view').innerHTML=`
  <div class="card">
    <div class="title">⚙️ 后台设置</div>
    <div class="row"><span>订单总数</span><b>${_orders.length}</b></div>
    <div class="row"><span>下单总额</span><b>¥${totalAmt.toFixed(2)}</b></div>
    <div class="row"><span>已确认金额</span><b style="color:#27ae60">¥${okAmt.toFixed(2)}</b></div>
  </div>
  <div class="card">
    <div class="sub">球号总数</div><input id="setTotal" value="${_total}">
    <button class="btn purple" onclick="saveTotal()">保存总数</button>
    <div class="sub">参考单价（填 0 = 不预填，让客户自己输）</div><input id="setRef" value="${_ref}">
    <button class="btn purple" onclick="saveRef()">保存参考价</button>
    <div class="sub">收款码图片地址</div><input id="setQr" value="${_qr}" placeholder="https://...">
    <button class="btn purple" onclick="saveQr()">保存收款码</button>
    ${_qr?`<img src="${_qr}" style="width:100%;max-height:200px;object-fit:contain;border-radius:8px">`:''}
    <div class="sub">规则说明</div><textarea id="setRule" rows="3" placeholder="写给大家看的规则">${_rule}</textarea>
    <button class="btn purple" onclick="saveRule()">保存规则</button>
    <button class="btn green" onclick="exportData()">📦 导出备份</button>
  </div>
  <div class="card">
    <div class="title">订单管理</div>
    ${_orders.length?_orders.map(o=>`<div class="row"><div style="min-width:0"><b>${o.nick}</b><div class="small">球号${o.balls.join(',')} ×${o.qty} · ¥${o.price}</div><div class="small">${o.time}</div></div><div style="text-align:right"><span class="tag ${o.status==='已确认'?'ok':''}">${o.status}</span><div style="margin-top:4px"><button class="btn green" style="width:auto;padding:4px 8px;font-size:12px" onclick="setStatus(${o.id},'已确认')">确认</button><button class="btn red" style="width:auto;padding:4px 8px;font-size:12px" onclick="setStatus(${o.id},'取消')">取消</button></div></div></div>`).join(''):'<div class="small">暂无订单</div>'}
  </div>
  <div class="card">
    <div class="title">用户（${_users.length}）</div>
    ${_users.map(u=>`<div class="row"><span>${u.nick}(${u.acc})${isAdmin(u.acc)?' <span class="tag ok">管理员</span>':''}</span></div>`).join('')}
    <button class="btn gray" onclick="logout()" style="margin-top:10px">退出登录</button>
  </div>`
}
function saveTotal(){_total=Math.max(1,parseInt(document.getElementById('setTotal').value)||1);DB.set('total',_total);renderAdm();toast('已保存')}
function saveRef(){_ref=Math.max(0,parseFloat(document.getElementById('setRef').value)||0);DB.set('ref',_ref);_amt=null;renderAdm();toast('已保存')}
function saveQr(){_qr=document.getElementById('setQr').value.trim();DB.set('qr',_qr);renderAdm();toast('已保存')}
function saveRule(){_rule=document.getElementById('setRule').value;DB.set('rule',_rule);toast('已保存')}
function setStatus(id,s){const o=_orders.find(x=>x.id===id);if(o){o.status=s;saveOrders();renderAdm();renderMy()}}
function exportData(){const d={users:_users,orders:_orders,total:_total,ref:_ref,qr:_qr,rule:_rule};const b=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='backup_'+Date.now()+'.json';a.click();toast('已导出')}

function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2000)}
function modal(h){document.getElementById('mbox').innerHTML='<span class="close" onclick="closeModal()">×</span>'+h;document.getElementById('modal').classList.add('on')}
function closeModal(){document.getElementById('modal').classList.remove('on')}

(function(){if(_me)afterLogin();else document.getElementById('view').innerHTML=authView()})();
</script>
</body>
</html>
