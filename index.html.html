<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>球号订购系统</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0f1420;--card:#1a2233;--card2:#232d42;--line:#2d3a52;
  --txt:#e8edf5;--txt2:#93a2bd;--pri:#4f8cff;--pri2:#3b6fd4;
  --ok:#2ecc71;--warn:#f5a623;--bad:#ff5a5f;
}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:linear-gradient(160deg,#0b0f1a,#141c2e);color:var(--txt);min-height:100vh;padding-bottom:90px}
.wrap{max-width:720px;margin:0 auto;padding:0 12px}
header{position:sticky;top:0;z-index:20;background:rgba(15,20,32,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);padding:12px 0 10px}
.header-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
header h1{font-size:18px;font-weight:700}
header .sub{font-size:11px;color:var(--txt2);margin-top:2px}
.tag{font-size:11px;padding:3px 8px;border-radius:20px;background:var(--card2);color:var(--txt2);border:1px solid var(--line)}
.tag.pri{background:rgba(79,140,255,.15);color:var(--pri);border-color:rgba(79,140,255,.35)}
.tag.hot{background:rgba(255,90,95,.15);color:var(--bad);border-color:rgba(255,90,95,.3)}
.btn{font-family:inherit;font-size:14px;border:none;border-radius:10px;padding:10px 16px;cursor:pointer;transition:.15s;font-weight:600}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--pri);color:#fff}
.btn.ghost{background:var(--card2);color:var(--txt);border:1px solid var(--line)}
.btn.danger{background:rgba(255,90,95,.15);color:var(--bad);border:1px solid rgba(255,90,95,.3)}
.btn.sm{padding:6px 12px;font-size:12px;border-radius:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}
.section-tabs{display:flex;gap:8px;margin-bottom:10px}
.section-tabs .stab{flex:1;text-align:center;padding:10px 0;border-radius:10px;cursor:pointer;font-size:14px;font-weight:600;
  background:var(--card2);border:1px solid var(--line);color:var(--txt2);transition:.15s}
.section-tabs .stab.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px}
.ball{position:relative;aspect-ratio:1/1;border-radius:50%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;cursor:pointer;border:2px solid var(--line);
  background:radial-gradient(circle at 32% 28%,#3a4a6b,#1c2538);transition:.15s;user-select:none}
.ball:active{transform:scale(.92)}
.ball .num{font-size:22px;font-weight:800;line-height:1}
.ball .stk{font-size:9px;color:var(--txt2);margin-top:1px}
.ball.out{opacity:.38;background:#1a1f2b;cursor:not-allowed}
.ball.sel{border-color:var(--pri);box-shadow:0 0 0 3px rgba(79,140,255,.18)}
.ball input[type="checkbox"]{position:absolute;top:4px;left:4px;width:16px;height:16px;accent-color:var(--pri);pointer-events:none}
.ball.hot{border-color:rgba(255,90,95,.4);background:radial-gradient(circle at 32% 28%,#5a3040,#1c1528)}
.ball.hot .num{color:#ff8a8e}
.bar{position:sticky;top:56px;z-index:15;background:rgba(15,20,32,.9);backdrop-filter:blur(8px);
  padding:8px 0;border-bottom:1px solid var(--line)}
.bar-in{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input,select,textarea{font-family:inherit;background:var(--card2);border:1px solid var(--line);
  color:var(--txt);border-radius:9px;padding:9px 11px;font-size:14px;outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--pri)}
textarea{resize:vertical;min-height:80px}
.search{flex:1;min-width:120px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;font-size:13px;padding:8px 14px;border-radius:10px;cursor:pointer;color:var(--txt2);
  background:var(--card);border:1px solid var(--line);white-space:nowrap}
.tab.on{background:var(--pri);color:#fff;border-color:var(--pri);font-weight:600}
.view{display:none}.view.on{display:block}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:flex-end;z-index:100;justify-content:center}
.modal.show{display:flex}
.modal .sheet{background:var(--bg);width:100%;max-width:720px;border-radius:18px 18px 0 0;
  max-height:92vh;overflow:auto;padding:18px 16px 26px;animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal.center{align-items:center}
.modal.center .sheet{border-radius:18px;max-width:400px;width:calc(100% - 32px)}
.batch-bar{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:2px solid var(--pri);
  padding:12px 16px;display:none;align-items:center;gap:10px;z-index:200;box-shadow:0 -2px 10px rgba(0,0,0,.3);flex-wrap:wrap}
.batch-bar.show{display:flex}
.batch-bar .sc{font-size:13px;color:var(--pri);white-space:nowrap}
.batch-bar .qty-input{width:60px;padding:6px 8px;border:1px solid var(--line);border-radius:4px;
  text-align:center;background:var(--card2);color:var(--txt);font-size:15px}
.batch-bar button{padding:8px 14px;border:none;border-radius:6px;cursor:pointer;font-size:14px;white-space:nowrap}
.batch-bar .btn-submit{background:var(--pri);color:#fff}
.batch-bar .btn-clear{background:var(--card2);color:var(--txt2);border:1px solid var(--line)}
.list{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.row{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
.flex{display:flex;gap:8px;align-items:center}
.flex.between{justify-content:space-between}
.mono{font-family:"SF Mono",Consolas,monospace;font-size:12px}
.badge{font-size:11px;padding:2px 8px;border-radius:20px;font-weight:600}
.badge.pending{background:rgba(245,166,35,.15);color:var(--warn)}
.badge.paid{background:rgba(46,204,113,.15);color:var(--ok)}
.badge.cancel{background:rgba(147,162,189,.15);color:var(--txt2)}
.empty{text-align:center;color:var(--txt2);padding:30px 0;font-size:13px}
.toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.8);opacity:0;z-index:300;
  background:rgba(0,0,0,.88);color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;pointer-events:none;
  transition:.2s;max-width:80%;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--txt2);font-size:11px;font-weight:600}
.qrbox{width:230px;height:230px;margin:0 auto;border:2px dashed var(--line);border-radius:14px;
  display:flex;align-items:center;justify-content:center;color:var(--txt2);font-size:12px;text-align:center;
  background:var(--card2);overflow:hidden}
.qrbox img{max-width:100%;max-height:100%}
.hint{font-size:12px;color:var(--txt2);line-height:1.7;margin-top:8px}
.kv{font-size:13px;color:var(--txt2);line-height:1.9}
.kv b{color:var(--txt);font-weight:600}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.gap8{gap:8px}
.auth-toggle{display:flex;margin-bottom:14px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.auth-toggle button{flex:1;padding:10px;border:none;background:var(--card2);color:var(--txt2);font-size:14px;cursor:pointer;font-weight:600}
.auth-toggle button.on{background:var(--pri);color:#fff}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:250;display:none}
.mask.show{display:block}
</style>
</head>
<body>

<header>
  <div class="wrap header-row">
    <div>
      <h1>⚽ 球号订购</h1>
      <div class="sub">普通球 1~60 · 特价球 1~15</div>
    </div>
    <div id="headRight"></div>
  </div>
</header>

<div class="wrap">
  <div id="ruleBanner" class="card" style="display:none"></div>

  <div class="bar" id="toolBar">
    <div class="bar-in">
      <div class="search"><input id="kw" placeholder="🔍 搜球号"></div>
      <select id="fltStock" style="width:auto">
        <option value="all">全部</option>
        <option value="in">有货</option>
        <option value="out">缺货</option>
      </select>
    </div>
  </div>

  <!-- 选购页 -->
  <section class="view on" id="vShop">
    <div class="section-tabs">
      <div class="stab on" data-sec="normal">⚽ 普通球 (1~60)</div>
      <div class="stab" data-sec="hot">🔥 特价球 (1~15)</div>
    </div>
    <div class="card">
      <div class="grid" id="ballGrid"></div>
    </div>
  </section>

  <!-- 我的订单 -->
  <section class="view" id="vMy">
    <div class="tabs">
      <div class="tab on" data-f="all">全部</div>
      <div class="tab" data-f="pending">待支付</div>
      <div class="tab" data-f="paid">已收款</div>
      <div class="tab" data-f="cancel">已取消</div>
    </div>
    <div id="myList"></div>
  </section>

  <!-- 后台 -->
  <section class="view" id="vAdmin">
    <div id="adminGate"></div>
    <div id="adminMain" style="display:none">
      <div class="tabs" id="adminTabs">
        <div class="tab on" data-a="ov">概览</div>
        <div class="tab" data-a="orders">订单管理</div>
        <div class="tab" data-a="goods">商品统计</div>
        <div class="tab" data-a="rule">规则说明</div>
        <div class="tab" data-a="qr">收款码</div>
        <div class="tab" data-a="users">用户</div>
      </div>
      <div id="adminBody"></div>
    </div>
  </section>

  <!-- 登录/注册 -->
  <section class="view" id="vAuth">
    <div class="card">
      <div class="auth-toggle">
        <button id="authTabLogin" class="on">登录</button>
        <button id="authTabReg">注册</button>
      </div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <input placeholder="账号" id="fUser">
        <input placeholder="密码" id="fPwd" type="password">
        <input placeholder="昵称（注册时填）" id="fNick" style="display:none">
      </div>
      <button class="btn primary" style="width:100%;margin-top:14px" id="btnAuth">登录</button>
    </div>
  </section>

  <!-- 我的 -->
  <section class="view" id="vMe">
    <div class="card">
      <div style="font-weight:700;margin-bottom:12px">👤 我的</div>
      <div class="kv" id="meInfo"></div>
    </div>
    <div class="card">
      <div style="font-weight:700;margin-bottom:10px">🧾 我的收款码（退款用）</div>
      <div class="hint">上传你的收款码，这样需要退款时卖家能扫码转给你。</div>
      <div class="qrbox mt12" id="myQrBox">暂无收款码</div>
      <input type="file" id="myQrFile" accept="image/*" style="margin-top:12px">
      <div class="flex gap8 mt12">
        <button class="btn primary" id="myQrUp">上传</button>
        <button class="btn ghost" id="myQrClr">删除</button>
      </div>
    </div>
    <button class="btn danger" style="width:100%;margin-top:12px" id="btnLogout">退出登录</button>
  </section>
</div>

<!-- 批量下单栏 -->
<div class="batch-bar" id="batchBar">
  <span class="sc" id="selectedCount">已选 0 个</span>
  <span style="font-size:13px;color:var(--txt2)">数量：</span>
  <input class="qty-input" id="batchQty" type="number" min="1" max="100" value="1">
  <button class="btn-submit" id="btnSubmitBatch">提交订单</button>
  <button class="btn-clear" id="btnClearSel">清空</button>
</div>

<!-- 支付弹窗 -->
<div class="modal center" id="mPay">
  <div class="sheet">
    <div style="text-align:center">
      <div style="font-weight:700;font-size:16px">扫码支付</div>
      <div class="sub">订单 <span class="mono" id="payNo"></span></div>
      <div class="qrbox" id="qrBox"><div>收款码<br>请等待管理员设置</div></div>
      <div class="sub" style="margin-top:10px">支付完成后点击下方按钮通知卖家确认</div>
      <button class="btn primary" style="width:100%;margin-top:14px" id="btnPaid">我已支付，等待确认</button>
      <button class="btn ghost" style="width:100%;margin-top:8px" id="btnPayLater">稍后再付</button>
    </div>
  </div>
</div>

<!-- 下单人收款码弹窗 -->
<div class="modal center" id="mBuyerQr">
  <div class="sheet">
    <div style="text-align:center">
      <div style="font-weight:700;font-size:16px">🧾 下单人收款码</div>
      <div class="sub" id="buyerName"></div>
      <div class="qrbox" id="buyerQrBox"></div>
      <button class="btn ghost" style="width:100%;margin-top:14px" id="btnCloseBuyerQr">关闭</button>
    </div>
  </div>
</div>

<nav style="position:fixed;bottom:0;left:0;right:0;z-index:50;background:rgba(15,20,32,.96);border-top:1px solid var(--line)">
  <div class="wrap flex between" style="padding:8px 12px">
    <div class="tab navtab on" data-v="vShop" style="border:none">🏀<br><span style="font-size:10px">选购</span></div>
    <div class="tab navtab" data-v="vMy" style="border:none">📦<br><span style="font-size:10px">订单</span></div>
    <div class="tab navtab" data-v="vAdmin" id="navAdmin" style="border:none;display:none">🔧<br><span style="font-size:10px">后台</span></div>
    <div class="tab navtab" data-v="vMe" id="navMe" style="border:none">👤<br><span style="font-size:10px" id="meLabel">未登录</span></div>
  </div>
</nav>

<div class="toast" id="toast"></div>

<script>
'use strict';
const DB={get(k,d){try{return JSON.parse(localStorage.getItem('ball_'+k))||d}catch(e){return d}},set(k,v){localStorage.setItem('ball_'+k,JSON.stringify(v))}};
const $=s=>document.querySelector(s);
const on=(el,ev,fn)=>{const e=typeof el==='string'?$(el):el;e&&e.addEventListener(ev,fn)};
const show=s=>$(s).classList.add('show');
const hide=s=>$(s).classList.remove('show');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
function fmtTime(ts){const d=new Date(ts);const p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`}
function key(sec,no){return sec+'-'+no}

// ===== 数据 =====
let _me=DB.get('me',null);
let _goods=DB.get('goods',null);
if(!_goods){_goods=[];for(let i=1;i<=60;i++)_goods.push({no:i,section:'normal',stock:200});for(let i=1;i<=15;i++)_goods.push({no:i,section:'hot',stock:200});DB.set('goods',_goods)}
let _orders=DB.get('orders',[]);
let _users=DB.get('users',[]);
let _admins=DB.get('admins',[]);
let _rule=localStorage.getItem('ball_rule')||'';
let _adminOn=DB.get('adminOn',false);
let _myQr=localStorage.getItem('ball_myqr_'+( _me?_me.acc:'' ))||'';

function good(no,sec){return _goods.find(g=>g.no===no&&g.section===sec)}
function isAdmin(acc){return _admins.includes(acc)}
function saveGoods(){DB.set('goods',_goods)}
function saveOrders(){DB.set('orders',_orders)}
function saveUsers(){DB.set('users',_users)}
function saveAdmins(){DB.set('admins',_admins)}
function refreshMyQr(){_myQr=localStorage.getItem('ball_myqr_'+( _me?_me.acc:'' ))||''}

let SECTION='normal', SEL=new Set(), FILTER={kw:'',stock:'all'};

// ===== 球号渲染 =====
function renderBalls(){
  const kw=FILTER.kw.trim();
  const list=_goods.filter(g=>{
    if(g.section!==SECTION)return false;
    if(FILTER.stock==='in'&&g.stock<=0)return false;
    if(FILTER.stock==='out'&&g.stock>0)return false;
    if(kw&&!String(g.no).includes(kw))return false;
    return true;
  });
  const box=$('#ballGrid');
  box.innerHTML='';
  if(!list.length){box.innerHTML='<div class="empty" style="grid-column:1/-1">没有符合条件的球号</div>';updateBatchBar();return}
  list.forEach(g=>{
    const d=document.createElement('div');
    d.className='ball'+(g.stock<=0?' out':'')+(SEL.has(key(g.section,g.no))?' sel':'')+(g.section==='hot'?' hot':'');
    d.dataset.sec=g.section;d.dataset.no=g.no;
    d.innerHTML=`<input type="checkbox" ${SEL.has(key(g.section,g.no))?'checked':''}><div class="num">${g.no}</div><div class="stk">库存${g.stock}</div>`;
    d.onclick=()=>{
      if(g.stock<=0)return;
      const k=key(g.section,g.no);
      if(SEL.has(k))SEL.delete(k);else SEL.add(k);
      renderBalls();
    };
    box.appendChild(d);
  });
  updateBatchBar();
}
function updateBatchBar(){
  const bar=$('#batchBar');
  $('#selectedCount').textContent='已选 '+SEL.size+' 个';
  bar.className='batch-bar'+(SEL.size>0?' show':'');
}
function clearSel(){SEL.clear();renderBalls()}

// ===== 下单 =====
function submitBatch(){
  if(!_me){toast('请先登录');go('vAuth');return}
  const qty=parseInt($('#batchQty').value)||1;
  if(qty<1||qty>100)return toast('数量需在 1~100 之间');
  if(SEL.size===0)return toast('请先选择球号');
  const items=[];
  for(const k of SEL){
    const parts=k.split('-');const sec=parts[0];const no=+parts[1];
    const g=good(no,sec);
    if(!g||g.stock<qty)return toast((sec==='hot'?'特价':'')+no+'号库存不足（剩'+ (g?g.stock:0) +'）');
    items.push({no,qty,section:sec});
  }
  items.forEach(it=>{const g=good(it.no,it.section);g.stock-=it.qty});
  saveGoods();
  const o={id:'B'+Date.now().toString(36).toUpperCase()+Math.random().toString(36).slice(2,5).toUpperCase(),
    uid:_me.acc,uname:_me.nick,items,status:'pending',created:Date.now()};
  _orders.unshift(o);saveOrders();
  SEL.clear();renderBalls();
  openPay(o);
}

// ===== 支付 =====
let PENDING=null;
function openPay(o){
  PENDING=o;$('#payNo').textContent=o.id;
  const seller=localStorage.getItem('ball_qrcode');
  $('#qrBox').innerHTML=seller?`<img src="${seller}" alt="收款码">`:'<div>收款码<br>请等待管理员设置</div>';
  show('#mPay');
}
function closePay(){hide('#mPay');PENDING=null}
function confirmPaid(){
  if(PENDING){const o=_orders.find(x=>x.id===PENDING.id);if(o)o.status='paid';saveOrders()}
  closePay();toast('已提交，等待卖家确认收款');go('vMy');renderMy();
}

// ===== 订单卡片 =====
function orderCard(o,mode){
  const d=document.createElement('div');d.className='row';
  const st={pending:'待支付',paid:'已收款',cancel:'已取消'}[o.status];
  const bc={pending:'badge pending',paid:'badge paid',cancel:'badge cancel'}[o.status];
  let acts='';
  if(o.status==='pending'){
    if(mode==='my'){acts+=`<button class="btn primary sm" data-a="pay">付款</button><button class="btn ghost sm" data-a="cancel">取消</button>`}
    else {acts+=`<button class="btn primary sm" data-a="confirm">标记已收款</button><button class="btn ghost sm" data-a="buyer">👤 收款码</button>`}
  } else if(o.status==='paid'){
    if(mode==='admin')acts+=`<button class="btn ghost sm" data-a="buyer">👤 收款码</button>`;
  } else if(o.status==='cancel'){
    if(mode==='my')acts+=`<button class="btn danger sm" data-a="del">删除</button>`;
  }
  d.innerHTML=`
    <div class="flex between" style="margin-bottom:8px">
      <div><div class="mono">${o.id}</div><div class="sub">${fmtTime(o.created)}${o.uname?' · '+esc(o.uname):''}</div></div>
      <span class="${bc}">${st}</span>
    </div>
    <div class="kv">${o.items.map(i=>'<div>· '+(i.section==='hot'?'<span class="tag hot">特价</span> ':'')+i.no+'号 × <b>'+i.qty+'</b></div>').join('')}</div>
    <div class="flex between mt12"><div></div><div class="flex gap8">${acts}</div></div>`;
  d.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{
    const a=b.dataset.a;
    if(a==='pay')openPay(o);
    else if(a==='cancel'){const x=_orders.find(y=>y.id===o.id);if(x)x.status='cancel';saveOrders();renderMy();if(_adminOn)renderAdmin()}
    else if(a==='confirm'){const x=_orders.find(y=>y.id===o.id);if(x)x.status='paid';saveOrders();toast('已标记已收款');renderMy();renderBalls();if(_adminOn)renderAdmin()}
    else if(a==='del'){_orders=_orders.filter(y=>y.id!==o.id);saveOrders();renderMy()}
    else if(a==='buyer')showBuyerQr(o);
  });
  return d;
}

// ===== 下单人收款码 =====
function showBuyerQr(o){
  $('#buyerName').textContent=esc(o.uname||o.uid||'');
  const qr=localStorage.getItem('ball_myqr_'+o.uid);
  $('#buyerQrBox').innerHTML=qr?`<img src="${qr}" alt="下单人收款码">`:'<div>该用户<br>未上传收款码</div>';
  show('#mBuyerQr');
}

// ===== 我的订单 =====
let MYF='all';
function renderMy(){
  if(!_me){$('#myList').innerHTML='<div class="empty">请先登录</div>';return}
  const all=_orders.filter(o=>o.uid===_me.acc);
  const f=all.filter(o=>MYF==='all'||o.status===MYF);
  const box=$('#myList');
  box.innerHTML='';
  if(!all.length){box.innerHTML='<div class="empty">还没有订单</div>';return}
  if(!f.length){box.innerHTML='<div class="empty">该状态下没有订单</div>';return}
  f.forEach(o=>box.appendChild(orderCard(o,'my')));
}

// ===== 后台 =====
let AV='ov';
function renderAdminGate(){
  $('#adminGate').innerHTML=`
    <div class="card">
      <div style="font-weight:700">🔐 管理员登录</div>
      <input id="fAdminPwd" type="password" placeholder="管理员密码" style="margin-top:10px">
      <button class="btn primary" style="width:100%;margin-top:10px" id="btnAdminLogin">进入后台</button>
      <div class="hint">提示：首个注册账号自动成为管理员；首次进入无需密码，可直接点进入。</div>
    </div>`;
  on($('#btnAdminLogin'),'click',()=>{
    const set=DB.get('adminPwd',null);
    const pwd=$('#fAdminPwd').value;
    if(set&&pwd!==set)return toast('密码错误');
    if(_me&&!isAdmin(_me.acc))return toast('当前账号不是管理员');

function renderAdmin(){
  if(!_adminOn)return;

  if(AV==='ov'){
    const paid=_orders.filter(o=>o.status==='paid');
    const m={};paid.forEach(o=>o.items.forEach(i=>{const k=key(i.section,i.no);m[k]=(m[k]||0)+i.qty}));
    const rank=Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,10);
    body.innerHTML=`
      <div class="flex between" style="flex-wrap:wrap">
        <div class="card" style="flex:1;min-width:120px"><div class="sub">累计订单</div><div style="font-size:24px;font-weight:800">${_orders.length}</div></div>
        <div class="card" style="flex:1;min-width:120px"><div class="sub">已收款</div><div style="font-size:24px;font-weight:800;color:var(--ok)">${paid.length}</div></div>
        <div class="card" style="flex:1;min-width:120px"><div class="sub">待支付</div><div style="font-size:24px;font-weight:800;color:var(--warn)">${_orders.filter(o=>o.status==='pending').length}</div></div>
      </div>
      <div class="card"><div style="font-weight:700;margin-bottom:8px">🏆 球号销量榜</div>
      ${rank.length?`<div class="scroll"><table><tr><th>排名</th><th>球号</th><th>类型</th><th>售出</th></tr>${rank.map((r,i)=>{const k=r[0],v=r[1];const p=k.split('-');return `<tr><td>${i+1}</td><td class="mono">${p[1]}号</td><td>${p[0]==='hot'?'<span class="tag hot">特价</span>':'普通'}</td><td><b>${v}</b></td></tr>`}).join('')}</table></div>`:'<div class="empty">暂无数据</div>'}</div>`;
  }
  else if(AV==='orders'){
    const all=_orders;
    const kw=($('#ofKw')?($('#ofKw').value||''):'').trim().toLowerCase();
    const st=($('#ofSt')?$('#ofSt').value:'all');
    const f=all.filter(o=>{
      if(st!=='all'&&o.status!==st)return false;
      if(!kw)return true;
      if(o.id.toLowerCase().includes(kw))return true;
      if((o.uname||'').toLowerCase().includes(kw))return true;
      if(o.items.some(i=>String(i.no).includes(kw)))return true;
      return false;
    });
    body.innerHTML=`<div class="hint">搜索订单号 / 昵称 / 球号</div>
      <div class="flex gap8 mt12"><input id="ofKw" placeholder="🔍 搜索" value="${esc(kw)}">
      <select id="ofSt" style="width:auto"><option value="all">全部</option><option value="pending">待支付</option><option value="paid">已收款</option><option value="cancel">已取消</option></select></div>
      <div class="list mt12" id="adminOrderList"></div>`;
    on($('#ofKw'),'input',()=>renderAdmin());
    const ss=$('#ofSt');ss.value=st;on(ss,'change',()=>renderAdmin());
    const list=$('#adminOrderList');
    if(!f.length){list.innerHTML='<div class="empty">没有订单</div>';return}
    f.forEach(o=>{
      const d=document.createElement('div');d.className='row';
      d.innerHTML=`<div class="flex between" style="margin-bottom:6px"><div><div class="mono">${o.id}</div><div class="sub">${fmtTime(o.created)} · ${esc(o.uname||'')}</div></div>
        <span class="badge ${o.status==='paid'?'paid':o.status==='cancel'?'cancel':'pending'}">${o.status==='paid'?'已收款':o.status==='cancel'?'已取消':'待支付'}</span></div>
        <div class="kv" style="font-size:12px">${o.items.map(i=>'<span class="tag" style="margin:2px">'+(i.section==='hot'?'特价 ':'')+i.no+'号×'+i.qty+'</span>').join('')}</div>
        <div class="flex gap8 mt12"><button class="btn primary sm" data-a="buyer" data-id="${o.id}">👤 收款码</button>${o.status==='pending'?`<button class="btn ghost sm" data-a="confirm" data-id="${o.id}">标记已收款</button>`:''}</div>`;
      d.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{
        const a=b.dataset.a,id=b.dataset.id;
        if(a==='buyer'){const o2=_orders.find(y=>y.id===id);if(o2)showBuyerQr(o2)}

    });
  }
  else if(AV==='goods'){
    body.innerHTML=`<div class="card">
      <div style="font-weight:700">🔍 球号下单统计查询</div>
      <div class="flex gap8 mt12">
        <select id="gfSec" style="width:auto"><option value="normal">普通球</option><option value="hot">特价球</option></select>
        <input id="gfKw" placeholder="输入球号，如 2" style="flex:1">
        <button class="btn primary sm" id="gfBtn">查询</button>
      </div>
      <div id="gfResult" class="mt12"></div>
    </div>
    <div class="card">
      <div style="font-weight:700">📦 全部库存</div>
      <div class="scroll mt12"><table>
        <tr><th>类型</th><th>球号</th><th>库存</th><th>下单量</th><th>已收款</th></tr>
        ${_goods.map(g=>{const rel=_orders.filter(o=>o.items.some(i=>i.no===g.no&&i.section===g.section));const q=rel.reduce((s,o)=>s+o.items.filter(i=>i.no===g.no&&i.section===g.section).reduce((a,b)=>a+b.qty,0),0);const pq=rel.filter(o=>o.status==='paid').reduce((s,o)=>s+o.items.filter(i=>i.no===g.no&&i.section===g.section).reduce((a,b)=>a+b.qty,0),0);return `<tr><td>${g.section==='hot'?'<span class="tag hot">特价</span>':'普通'}</td><td class="mono">${g.no}号</td><td>${g.stock}</td><td>${q}</td><td style="color:var(--ok)">${pq}</td></tr>`}).join('')}
      </table></div>
    </div>`;
    on($('#gfBtn'),'click',()=>{
      const sec=$('#gfSec').value;const no=parseInt(($('#gfKw').value||'').trim());
      if(!no)return toast('请输入球号');
      const rel=_orders.filter(o=>o.items.some(i=>i.no===no&&i.section===sec));
      const rows=rel.map(o=>({id:o.id,uname:o.uname,created:o.created,status:o.status,qty:o.items.find(i=>i.no===no&&i.section===sec).qty}));
      const total=rows.reduce((s,r)=>s+r.qty,0),paid=rows.filter(r=>r.status==='paid').reduce((s,r)=>s+r.qty,0);
      const g=good(no,sec);
      $('#gfResult').innerHTML=`<div class="card">
        <div class="flex between"><div><div style="font-weight:700">${sec==='hot'?'特价':'普通'} ${no}号</div><div class="sub">剩余库存 ${g?g.stock:0}</div></div>
        <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:8px">
          <span class="tag">下单笔数 ${rows.length}</span><span class="tag">下单总量 ${total}</span><span class="tag pri">已收款 ${paid}</span>
        </div></div>
        ${rows.length?`<div class="scroll mt12"><table><tr><th>订单号</th><th>下单人</th><th>数量</th><th>状态</th><th>时间</th></tr>${rows.map(r=>`<tr><td class="mono" style="font-size:11px">${r.id}</td><td>${esc(r.uname||'')}</td><td><b>${r.qty}</b></td><td>${r.status==='paid'?'<span style="color:var(--ok)">已收</span>':r.status==='pending'?'<span style="color:var(--warn)">待付</span>':'<span style="color:var(--txt2)">取消</span>'}</td><td style="font-size:11px">${fmtTime(r.created)}</td></tr>`).join('')}</table></div>`:'<div class="empty">暂无下单记录</div>'}`;
    });
  }
  else if(AV==='rule'){
    body.innerHTML=`<div class="card">
      <div style="font-weight:700">📝 规则说明</div>
      <div class="hint">在这里写下订购规则，朋友在选购页顶部会看到。</div>
      <textarea id="ruleText" placeholder="例如：每人限购、付款后不退、每周三开单..." style="margin-top:10px">${esc(_rule)}</textarea>
      <div class="flex gap8 mt12">
        <button class="btn primary" id="ruleSave">保存</button>
        <button class="btn ghost" id="ruleClear">清空</button>
      </div>
    </div>`;
    on($('#ruleSave'),'click',()=>{_rule=$('#ruleText').value;localStorage.setItem('ball_rule',_rule);renderRuleBanner();toast('规则已保存')});
    on($('#ruleClear'),'click',()=>{$('#ruleText').value='';_rule='';localStorage.removeItem('ball_rule');renderRuleBanner();toast('已清空')});
  }
  else if(AV==='qr'){
    const stored=localStorage.getItem('ball_qrcode');
    body.innerHTML=`<div class="card">
      <div style="font-weight:700">📷 收款码设置（卖给朋友的收款码）</div>
      <div class="qrbox mt12" id="qrPrev">${stored?`<img src="${stored}">`:'暂无收款码'}</div>
      <input type="file" id="qrFile" accept="image/*" style="margin-top:12px">
      <div class="flex gap8 mt12"><button class="btn primary" id="qrUp">上传并保存</button><button class="btn ghost" id="qrClr">清除</button></div>
    </div>`;
    on($('#qrUp'),'click',()=>{const f=$('#qrFile').files[0];if(!f)return toast('请先选图');const r=new FileReader();r.onload=e=>{localStorage.setItem('ball_qrcode',e.target.result);toast('收款码已保存');renderAdmin()};r.readAsDataURL(f)});
    on($('#qrClr'),'click',()=>{localStorage.removeItem('ball_qrcode');toast('已清除');renderAdmin()});
  }
  else if(AV==='users'){
    body.innerHTML=`<div class="card">
      <div style="font-weight:700">👥 用户管理（${_users.length}）</div>
      <div class="scroll mt12"><table><tr><th>账号</th><th>昵称</th><th>身份</th><th>操作</th></tr>
      ${_users.map(u=>{const a=isAdmin(u.acc);return `<tr><td>${esc(u.acc)}</td><td>${esc(u.nick||'-')}</td><td>${a?'<span class="badge paid">管理员</span>':'普通'}</td><td><button class="btn sm ${a?'ghost':'primary'}" data-ua="${esc(u.acc)}" data-v="${a?0:1}">${a?'降为普通':'升为管理员'}</button></td></tr>`}).join('')}
      </table></div>
      <div class="flex gap8 mt12"><button class="btn primary" id="expBtn">导出备份</button><button class="btn ghost" id="impBtn">导入恢复</button></div>
      <input type="file" id="impFile" accept=".json" style="display:none">
      <div style="margin-top:12px"><div class="sub">管理员密码</div><input id="newAdminPwd" placeholder="留空不修改" style="margin-top:6px"><button class="btn ghost sm mt8" id="saveAdminPwd">设置密码</button></div>
      <button class="btn danger" style="width:100%;margin-top:12px" id="logoutAdmin">退出后台</button>
    </div>`;
    body.querySelectorAll('[data-ua]').forEach(b=>b.onclick=()=>{
      const acc=b.dataset.ua;const v=+b.dataset.v;
      if(v){if(!_admins.includes(acc))_admins.push(acc)}else{const i=_admins.indexOf(acc);if(i>-1)_admins.splice(i,1)}
      if(_admins.length===0)return toast('至少保留一个管理员');
      saveAdmins();toast('已更新');renderAdmin();refreshNav();
    });
    on($('#expBtn'),'click',()=>{const d={goods:_goods,orders:_orders,users:_users,admins:_admins,rule:_rule,qrcode:localStorage.getItem('ball_qrcode')};const b=new Blob([JSON.stringify(d)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='backup.json';a.click()});
    on($('#impBtn'),'click',()=>$('#impFile').click());
    on($('#impFile'),'change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=t=>{const d=JSON.parse(t.target.result);if(d.goods){_goods=d.goods;saveGoods()}if(d.orders){_orders=d.orders;saveOrders()}if(d.users){_users=d.users;saveUsers()}if(d.admins){_admins=d.admins;saveAdmins()}if(d.rule!==undefined){_rule=d.rule;if(_rule)localStorage.setItem('ball_rule',_rule);else localStorage.removeItem('ball_rule')}if(d.qrcode!==undefined){if(d.qrcode)localStorage.setItem('ball_qrcode',d.qrcode);else localStorage.removeItem('ball_qrcode')}toast('已恢复');renderBalls();renderRuleBanner();if(_adminOn)renderAdmin()};r.readAsText(f)});
    on($('#saveAdminPwd'),'click',()=>{const v=$('#newAdminPwd').value;if(v){DB.set('adminPwd',v);toast('密码已设置')}else toast('留空不修改')});
    on($('#logoutAdmin'),'click',()=>{_adminOn=false;DB.set('adminOn',false);$('#adminGate').style.display='';$('#adminMain').style.display='none';renderAdminGate();refreshNav();go('vShop')});
  }
}

// ===== 规则横幅 =====
function renderRuleBanner(){
  const b=$('#ruleBanner');
  if(_rule.trim()){b.style.display='';b.innerHTML=`<div style="font-weight:700;margin-bottom:6px">📌 订购规则</div><div class="hint" style="margin:0;white-space:pre-wrap">${esc(_rule)}</div>`}
  else b.style.display='none';
}

// ===== 登录/注册 =====
let AUTH='login';
function setAuthMode(m){
  AUTH=m;
  $('#authTabLogin').classList.toggle('on',m==='login');
  $('#authTabReg').classList.toggle('on',m==='register');
  $('#btnAuth').textContent=m==='login'?'登录':'注册';
  $('#fNick').style.display=m==='login'?'none':'block';
}
function doAuth(){
  const acc=($('#fUser').value||'').trim(),pwd=($('#fPwd').value||''),nick=($('#fNick').value||'').trim();
  if(!acc||!pwd)return toast('账号密码必填');
  if(AUTH==='login'){
    const u=_users.find(x=>x.acc===acc&&x.pwd===pwd);
    if(!u)return toast('账号或密码错误');
    _me={acc,pwd,nick:u.nick};DB.set('me',_me);afterLogin();toast('登录成功');
  }else{
    if(_users.find(x=>x.acc===acc))return toast('账号已存在');
    if(!nick)return toast('昵称必填');
    _users.push({acc,pwd,nick});saveUsers();
    if(_users.length===1){_admins.push(acc);saveAdmins();_adminOn=true;DB.set('adminOn',true)}
    _me={acc,pwd,nick};DB.set('me',_me);
    toast(_users.length===1?'注册成功，你已成为管理员':'注册成功');
    afterLogin();
  }
}
function afterLogin(){
  $('#fUser').value='';$('#fPwd').value='';$('#fNick').value='';
  refreshMyQr();
  refreshNav();
  if(_adminOn&&isAdmin(_me.acc)){renderAdmin()}else{$('#adminGate').style.display='';$('#adminMain').style.display='none';renderAdminGate()}
  renderMe();
  go('vShop');
}
function logout(){
  _me=null;DB.set('me',null);_myQr='';refreshNav();renderMe();
  $('#meLabel').textContent='未登录';
  toast('已退出登录');
  go('vShop');
}

// ===== 我的页面 =====
function renderMe(){
  if(!_me){$('#meInfo').innerHTML='<div class="empty" style="padding:10px 0">请先登录</div>';return}
  $('#meInfo').innerHTML=`<div>昵称：<b>${esc(_me.nick)}</b></div><div>账号：<b>${esc(_me.acc)}</b></div>${isAdmin(_me.acc)?'<div>身份：<span class="badge paid">管理员</span></div>':''}`;
  const qr=localStorage.getItem('ball_myqr_'+_me.acc);
  $('#myQrBox').innerHTML=qr?`<img src="${qr}">`:'暂无收款码';
}

// ===== 导航 =====
function refreshNav(){
  if(_me){$('#meLabel').textContent=_me.nick||_me.acc;$('#headRight').innerHTML=`<span class="tag pri">${esc(_me.nick||_me.acc)}</span>`}
  else{$('#meLabel').textContent='未登录';$('#headRight').innerHTML=''}
  $('#navMe').style.display='';
  $('#navAdmin').style.display=(_me&&(isAdmin(_me.acc)||_adminOn))?'':'none';
}
function go(v){
  document.querySelectorAll('.view').forEach(x=>x.classList.remove('on'));
  document.querySelectorAll('.navtab').forEach(t=>t.classList.toggle('on',t.dataset.v===v));
  if(v==='vShop'){$('#vShop').classList.add('on');renderBalls()}
  else if(v==='vMy'){$('#vMy').classList.add('on');renderMy()}
  else if(v==='vAdmin'){$('#vAdmin').classList.add('on');if(_adminOn&&isAdmin(_me.acc)){$('#adminGate').style.display='none';$('#adminMain').style.display=''}else{$('#adminGate').style.display='';$('#adminMain').style.display='none';renderAdminGate()}renderAdmin()}
  else if(v==='vMe'){$('#vMe').classList.add('on');renderMe()}
  else if(v==='vAuth'){$('#vAuth').classList.add('on');setAuthMode('login')}
  window.scrollTo(0,0);
}

// ===== 初始化 =====
function init(){
  // 搜索/筛选
  on($('#kw'),'input',e=>{FILTER.kw=e.target.value;renderBalls()});
  on($('#fltStock'),'change',e=>{FILTER.stock=e.target.value;renderBalls()});
  // 分区切换
  document.querySelectorAll('.stab').forEach(t=>on(t,'click',()=>{
    document.querySelectorAll('.stab').forEach(x=>x.classList.remove('on'));t.classList.add('on');
    SECTION=t.dataset.sec;SEL.clear();renderBalls();
  }));
  // 导航
  document.querySelectorAll('.navtab').forEach(t=>on(t,'click',()=>{
    const v=t.dataset.v;
    if(v==='vMe'&&!_me){go('vAuth');return}
    if(v==='vAdmin'&&!_me){toast('请先登录');go('vAuth');return}
    go(v);
  }));
  // 我的订单 tab
  document.querySelectorAll('#vMy .tab').forEach(t=>on(t,'click',()=>{
    document.querySelectorAll('#vMy .tab').forEach(x=>x.classList.remove('on'));t.classList.add('on');
    MYF=t.dataset.f;renderMy();
  }));
  // 后台 tab
  document.querySelectorAll('#adminTabs .tab').forEach(t=>on(t,'click',()=>{
    document.querySelectorAll('#adminTabs .tab').forEach(x=>x.classList.remove('on'));t.classList.add('on');
    AV=t.dataset.a;renderAdmin();
  }));
  // 登录注册
  on($('#authTabLogin'),'click',()=>setAuthMode('login'));
  on($('#authTabReg'),'click',()=>setAuthMode('register'));
  on($('#btnAuth'),'click',doAuth);
  // 批量下单
  on($('#btnSubmitBatch'),'click',submitBatch);
  on($('#btnClearSel'),'click',clearSel);
  // 支付
  on($('#btnPaid'),'click',confirmPaid);
  on($('#btnPayLater'),'click',closePay);
  // 下单人收款码
  on($('#btnCloseBuyerQr'),'click',()=>hide('#mBuyerQr'));
  // 我的收款码
  on($('#myQrUp'),'click',()=>{if(!_me)return toast('请先登录');const f=$('#myQrFile').files[0];if(!f)return toast('请先选图');const r=new FileReader();r.onload=e=>{localStorage.setItem('ball_myqr_'+_me.acc,e.target.result);renderMe();toast('已上传')};r.readAsDataURL(f)});
  on($('#myQrClr'),'click',()=>{if(!_me)return;localStorage.removeItem('ball_myqr_'+_me.acc);renderMe();toast('已删除')});
  // 退出登录
  on($('#btnLogout'),'click',()=>{if(confirm('退出登录？'))logout()});

  renderRuleBanner();
  refreshNav();
  if(_me){$('#headRight').innerHTML=`<span class="tag pri">${esc(_me.nick||_me.acc)}</span>`}
  if(_adminOn&&_me&&isAdmin(_me.acc)){renderAdmin()}
  renderBalls();
}
init();
</script>
</body>
</html>
